# 放入 ntfy fork 仓库的 .github/workflows/build.yml
# 功能：推 tag（v*）→ Go 编译 linux-amd64 二进制 → 按上游命名格式打包 → 挂到 fork 的 Release
name: build-binary

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: |
          go build -ldflags "-s -w" -o ntfy .
          VER=${GITHUB_REF_NAME#v}
          tar czf "ntfy_${VER}_linux_amd64.tar.gz" ntfy

      - name: Release (tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ntfy_*_linux_amd64.tar.gz
