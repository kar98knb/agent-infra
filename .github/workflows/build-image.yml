name: build-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agent-infra:latest .

      - name: Export tar
        run: docker save agent-infra:latest -o agent-infra-latest.tar

      - name: Upload to Release (tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: agent-infra-latest.tar

      - name: Upload artifact (手动触发)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: agent-infra-tar
          path: agent-infra-latest.tar
