name: build-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build hermes image（自建瘦身 Dockerfile，内部 clone fork dev）
        run: docker build -t agent-hermes:latest .

      - name: Build ntfy image
        run: docker build -t agent-ntfy:latest -f Dockerfile.ntfy .

      - name: Export tars
        run: |
          docker save agent-hermes:latest -o agent-hermes-latest.tar
          docker save agent-ntfy:latest -o agent-ntfy-latest.tar

      - name: Upload to Release (tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent-hermes-latest.tar
            agent-ntfy-latest.tar

      - name: Upload artifact (手动触发)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: agent-tars
          path: |
            agent-hermes-latest.tar
            agent-ntfy-latest.tar
